name: Build CallVexa Native iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile CallVexa Native IPA (macOS Runner)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve Swift Package Manager Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project CallVexa.xcodeproj

      - name: Compile Native Release Archive
        run: |
          mkdir -p build/xcarchive
          mkdir -p dist

          echo "Compiling CallVexa.xcodeproj for physical iOS devices (arm64)..."
          xcodebuild -project CallVexa.xcodeproj \
            -scheme CallVexa \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/xcarchive/CallVexa.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        run: |
          echo "Packaging compiled .app bundle into CallVexa.ipa..."
          mkdir -p Payload
          APP_DIR=$(find build/xcarchive/CallVexa.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "Error: App bundle not found in archive."
            exit 1
          fi

          echo "Found app bundle at: $APP_DIR"
          cp -R "$APP_DIR" Payload/CallVexa.app

          # Ad-hoc sign embedded frameworks and application bundle
          echo "Applying ad-hoc code signature..."
          codesign --force --deep --sign - Payload/CallVexa.app
          codesign -vv -d Payload/CallVexa.app

          # Package into dist/CallVexa.ipa
          zip -r dist/CallVexa.ipa Payload
          rm -rf Payload

          echo "Listing dist/ contents:"
          ls -lh dist/CallVexa.ipa

      - name: Verify IPA Structure & Executable
        run: |
          echo "Verifying compiled IPA contents..."
          unzip -l dist/CallVexa.ipa | head -n 35

          # Verify Mach-O ARM64 binary inside IPA
          unzip -q dist/CallVexa.ipa -d temp_verify
          file temp_verify/Payload/CallVexa.app/CallVexa
          otool -l temp_verify/Payload/CallVexa.app/CallVexa | grep -A 5 LC_VERSION_MIN_IPHONEOS || true
          rm -rf temp_verify
          echo "Verification complete!"

      - name: Upload IPA as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallVexa-iOS-IPA
          path: dist/CallVexa.ipa
          retention-days: 14
