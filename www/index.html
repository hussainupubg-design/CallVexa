<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CallVexa — Cloud Dialer</title>
  <style>
    :root {
      --bg-color: #0a0f1e;
      --card-bg: #111a2e;
      --card-border: #1e2c4f;
      --primary: #2f6bff;
      --primary-hover: #4079ff;
      --text-main: #f0f4fc;
      --text-muted: #8a9bb5;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: calc(env(safe-area-inset-top, 20px) + 24px);
      padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 24px);
      user-select: none;
      -webkit-user-select: none;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-container {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: rgba(47, 107, 255, 0.12);
      border: 1px solid rgba(47, 107, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }

    .logo-svg {
      width: 44px;
      height: 44px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #fbbf24;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
      color: #ffffff;
    }

    p.subtitle {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .action-button {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #2f6bff 0%, #1e52db 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(47, 107, 255, 0.35);
      transition: all 0.2s ease;
    }

    .action-button:active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(47, 107, 255, 0.25);
    }

    .action-button.loading {
      opacity: 0.8;
      pointer-events: none;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .action-button.loading .spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #556885;
      text-align: center;
    }

    .diagnostics {
      margin-top: 16px;
      font-size: 11px;
      color: #4a5c78;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="14" fill="#0a0f1e"/>
        <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#2f6bff" stroke-width="3"/>
        <path d="M20 16c-2 0-3.5 1.2-4 3-1.5 5.5 1 14 8 21s15.5 9.5 21 8c1.8-.5 3-2 3-4v-4c0-1.5-1-2.7-2.4-3.1l-4.8-1.4c-1.3-.4-2.7.1-3.4 1.2l-1.6 2.4c-3.2-1.8-6-4.6-7.8-7.8l2.4-1.6c1.1-.7 1.6-2.1 1.2-3.4L30.2 22c-.4-1.4-1.6-2.4-3.1-2.4H20z" fill="#2f6bff"/>
      </svg>
    </div>

    <div class="status-badge" id="statusBadge">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connection Offline</span>
    </div>

    <h1 id="titleText">Unable to Connect</h1>
    <p class="subtitle" id="subtitleText">
      CallVexa could not reach the cloud server (https://callvexa.us). Please check your Wi-Fi or cellular data connection.
    </p>

    <button class="action-button" id="retryBtn" onclick="attemptReconnect()">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Retry Connection</span>
    </button>

    <div class="diagnostics" id="diagnostics">
      Server: https://callvexa.us
    </div>
  </div>

  <div class="footer">
    CallVexa Cloud Call Center &bull; iOS Client
  </div>

  <script>
    const TARGET_URL = 'https://callvexa.us';

    function attemptReconnect() {
      const btn = document.getElementById('retryBtn');
      const btnText = document.getElementById('btnText');
      const statusText = document.getElementById('statusText');
      
      btn.classList.add('loading');
      btnText.textContent = 'Connecting...';
      statusText.textContent = 'Checking network...';

      // Test connection with a lightweight fetch
      fetch(TARGET_URL + '/favicon.svg?t=' + Date.now(), { method: 'HEAD', cache: 'no-cache', mode: 'no-cors' })
        .then(() => {
          statusText.textContent = 'Connected! Loading...';
          btnText.textContent = 'Loading CallVexa...';
          window.location.replace(TARGET_URL);
        })
        .catch(err => {
          console.warn('Reconnect failed:', err);
          setTimeout(() => {
            btn.classList.remove('loading');
            btnText.textContent = 'Retry Connection';
            statusText.textContent = 'Connection Offline';
          }, 800);
        });
    }

    // Auto-retry when the system network comes back online
    window.addEventListener('online', () => {
      console.log('Device back online, attempting reconnect...');
      attemptReconnect();
    });

    // Initial check on load: if online, try immediate redirect
    if (navigator.onLine) {
      setTimeout(attemptReconnect, 300);
    }
  </script>
</body>
</html>
